        /* 배경 orb */
        .orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(70px);
            will-change: transform;
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(180, 10, 10, 0.55) 0%, transparent 65%);
            top: -20%;
            left: -15%;
            animation: floatOrb1 8s ease-in-out infinite;
        }

        .orb-2 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(200, 30, 30, 0.35) 0%, transparent 60%);
            bottom: -15%;
            right: -12%;
            animation: floatOrb2 10s ease-in-out infinite;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(140, 7, 7, 0.3) 0%, transparent 60%);
            top: 40%;
            left: 55%;
            animation: floatOrb3 7s ease-in-out infinite;
        }

        @keyframes floatOrb1 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
                opacity: .9;
            }

            40% {
                transform: translate(12%, 16%) scale(1.12);
                opacity: 1;
            }

            70% {
                transform: translate(-8%, 8%) scale(.92);
                opacity: .75;
            }
        }

        @keyframes floatOrb2 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
                opacity: .8;
            }

            35% {
                transform: translate(-12%, -12%) scale(1.15);
                opacity: 1;
            }

            70% {
                transform: translate(8%, -14%) scale(.9);
                opacity: .65;
            }
        }

        @keyframes floatOrb3 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
                opacity: .7;
            }

            50% {
                transform: translate(-16%, 14%) scale(1.2);
                opacity: 1;
            }
        }

        body {

            color: #e2e8f0;

            display: flex;
            flex-direction: column;

            font-size: 14px;
            font-weight: 600;

        /* ----- Main Layout ----- */
        .container {
            flex: 1;
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 24px 20px;
            gap: 30px;
        }

        /* ----- Sidebar (Filter) ----- */
        .sidebar {
            width: 240px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-title {
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.35);

            padding-left: 4px;
            letter-spacing: 1px;

            border-radius: 12px;
            text-align: left;
            font-size: 14px;
            font-weight: 600;

            justify-content: space-between;

        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 20px;

        .grid-title {

            font-weight: 800;
            color: white;

            background: #e6fffa;
            color: #047857;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;

            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;

        .card {

            position: relative;

            left: 0;

            height: 4px;
            background: transparent;

        .card-title {

            font-weight: 700;
            color: white;
            line-height: 1.4;
            margin-bottom: 12px;

            -webkit-box-orient: vertical;
            line-clamp: 2;
            overflow: hidden;
        }

        .card-host {

            color: rgba(255, 255, 255, 0.5);

                grid-template-columns: 1fr;

                align-items: flex-start;
                gap: 10px;

            if (type.includes('해커톤') || type.includes('코딩')) return 'type-camp';
            if (type.includes('대회') || type.includes('공모전')) return 'type-contest';
            if (type.includes('어학')) return 'type-cert';
            return 'type-contest';
        }

        function renderGrid() {
            const grid = document.getElementById('activity-grid');
            grid.innerHTML = '';

            const filteredData = currentCategory === 'all'
                ? activityData
                : activityData.filter(item => item.category === currentCategory || item.category === 'all');

            if (filteredData.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; padding: 40px; text-align:center; color:#94a3b8;">해당 진로의 사이트가 없습니다.</div>`;
                return;
            }

            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="tags">
                            <span class="tag source">${item.source}</span>
                            <span class="tag ${getTypeClass(item.type)}">${item.type}</span>
                        </div>
                        <span class="d-day safe">바로가기</span>
                    </div>
                    <div class="card-title">${item.title}</div>
                    <div class="card-host" style="margin-bottom:8px; font-weight:bold; color: rgba(255,255,255,0.7);">${item.host}</div>
                    <div style="font-size: 14px; color: rgba(255,255,255,0.55); margin-bottom: 20px; line-height: 1.5;">${item.description}</div>
                    
                    <div class="card-footer" style="margin-top: auto;">
                        <button class="btn-view" style="width: 100%; border-radius: 8px;" onclick="window.open('${item.link.replace(/'/g, "\\'")}', '_blank')">사이트 방문하기 &rarr;</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setupFilters() {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Remove active from all
                    buttons.forEach(b => b.classList.remove('active'));
                    // Add active to clicked
                    btn.classList.add('active');

                    currentCategory = btn.dataset.category;
                    document.getElementById('current-category').innerText = categoryNames[currentCategory];

                    renderGrid();
                });
            });
        }

        // Initialize App
        init();

    </script>
</body>

</html>
