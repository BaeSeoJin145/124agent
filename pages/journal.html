<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>논문 요약 & 추천 — 12-4 Agent</title>

    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#810707">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0d0606;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* 배경 orb */
        .orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(70px);
            will-change: transform;
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(180, 10, 10, 0.55) 0%, transparent 65%);
            top: -20%;
            left: -15%;
            animation: floatOrb1 8s ease-in-out infinite;
        }

        .orb-2 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(200, 30, 30, 0.35) 0%, transparent 60%);
            bottom: -15%;
            right: -12%;
            animation: floatOrb2 10s ease-in-out infinite;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(140, 7, 7, 0.3) 0%, transparent 60%);
            top: 40%;
            left: 55%;
            animation: floatOrb3 7s ease-in-out infinite;
        }

        @keyframes floatOrb1 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
                opacity: .9;
            }

            40% {
                transform: translate(12%, 16%) scale(1.12);
                opacity: 1;
            }

            70% {
                transform: translate(-8%, 8%) scale(.92);
                opacity: .75;
            }
        }

        @keyframes floatOrb2 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
                opacity: .8;
            }

            35% {
                transform: translate(-12%, -12%) scale(1.15);
                opacity: 1;
            }

            70% {
                transform: translate(8%, -14%) scale(.9);
                opacity: .65;
            }
        }

        @keyframes floatOrb3 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
                opacity: .7;
            }

            50% {
                transform: translate(-16%, 14%) scale(1.2);
                opacity: 1;
            }
        }

        /* 헤더 */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
            background: rgba(13, 6, 6, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            padding: 15px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h2 {
            font-size: clamp(18px, 4vw, 22px);
            font-weight: 700;
            letter-spacing: -0.5px;
            color: white;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }



        button.primary {
            background: #810707;
            border-color: #a10a0a;
            color: white;
        }

        button.primary:hover {
            background: #a10a0a;
        }

        /* 메인 컨테이너 */
        main {
            flex: 1;
            position: relative;
            z-index: 1;
            padding: 40px 24px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* 검색 바 */
        .search-container {
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
        }

        .search-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            padding: 8px 12px;
            outline: none;
        }

        .search-container input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* 논문 리스트 */
        #results {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .paper-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: transform 0.2s, background 0.2s;
        }

        .paper-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .paper-title {
            font-size: 18px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .paper-meta {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 12px;
        }

        .paper-meta span {
            color: #93c5fd;
            /* 연도/저널명 강조 */
        }

        .paper-abstract {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .paper-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .paper-actions button {
            font-size: 13px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 로딩 */
        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.5);
            display: none;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #f87171;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* 모달 공통 */
    </style>
    <style>

        .sidebar {

        }

        .filter-title {
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 8px;
            padding-left: 4px;
            letter-spacing: 1px;

        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);

            border-color: rgba(248, 113, 113, 0.2);

        }

        .filter-btn.active {

        /* ----- Content Grid ----- */
        .content {
            flex: 1;

        .grid-title {

        .card-grid {

        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);

        .tag-int {

        }

        .card-desc {
            font-size: 14px;

            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;

        }

        .card-footer {

        }

        .btn-view {

        .btn-view:hover {

        .btn-ai {

        @media (max-width: 900px) {

        if (!studentId) {
            alert("로그인이 필요합니다.");
            location.href = "../index.html";
        }

        // 정적 추천 논문 DB
        const journalData = [
            // General (종합)
            { id: 1, title: 'KCI (한국학술지인용색인)', category: 'general', tags: ['종합 DB', 'KCI 등재 판별', '국내'], desc: '한국연구재단에서 운영하며, 국내 학술지의 KCI 등재 여부(등재, 등재후보)를 가장 정확히 검색할 수 있는 공식 시스템입니다.', url: 'https://www.kci.go.kr/' },
            { id: 2, title: 'DBpia (디비피아)', category: 'general', tags: ['종합 DB', 'KCI 다수', '국내'], desc: '국내 최대 학술 논문 플랫폼 중 하나로, 인문/사회/과학/예체능 등 모든 분야의 KCI 등재지를 다수 제공합니다.', url: 'https://www.dbpia.co.kr/' },
            { id: 3, title: 'RISS (학술연구정보서비스)', category: 'general', tags: ['학위논문', '국내/해외'], desc: '전국 대학 소장 자료 및 국내 석/박사 학위 논문을 무료 열람할 수 있는 국가 단위 서비스입니다.', url: 'https://www.riss.kr/' },
            { id: 4, title: 'KISS (한국학술정보)', category: 'general', tags: ['종합 DB', 'KCI 다수', '국내'], desc: 'DBpia와 경쟁하는 또 다른 국내 거대 학술 DB로, 특정 학회의 논문은 KISS에만 독점 제공되는 경우가 있습니다.', url: 'https://kiss.kstudy.com/' },
            { id: 5, title: 'Google Scholar', category: 'general', tags: ['종합 DB', '글로벌'], desc: '전 세계의 학위논문, 학술지, 단행본, 프리프린트 등을 모두 검색할 수 있는 가장 광범위한 무료 플랫폼입니다.', url: 'https://scholar.google.com/' },
            { id: 6, title: 'Web of Science', category: 'general', tags: ['SCIE / SSCI / A&HCI', '국제 핵심'], desc: 'Clarivate에서 제공하는 최고 권위의 국제 학술지 인용 색인 시스템. SCI 급 국제 논문 검증의 스탠다드입니다.', url: 'https://mjl.clarivate.com/home' },
            { id: 7, title: 'Scopus', category: 'general', tags: ['SCOPUS', '국제 우수'], desc: 'Elsevier가 제공하는 세계 최대의 초록/인용 데이터베이스로, SCI 다음으로 넓은 국제 인증 기준입니다.', url: 'https://www.scopus.com/' },

            { id: 25, title: '대한건축학회 / AIK', category: 'art', tags: ['건축/디자인', 'KCI 등재'], desc: '건축 계획, 디자인, 공학 관련 논문이 KCI 등재되어 있으며 대한건축학회(AIK) 학술대회 자료 조사가 가능합니다.', url: 'https://www.aik.or.kr/' },
            { id: 26, title: '한국예술종합학교 학술지', category: 'art', tags: ['예술전문', 'KCI 등재'], desc: '한예종 산하 예술연구소 등에서 발행하는 예술학, 미술, 음악, 영상 관련 깊이있는 KCI 논문을 구합니다.', url: 'http://www.karts.ac.kr/' }
        ];

        /* 카테고리 매핑 로직 */
        const categoryNames = {
            "all": "전체 추천 논문 사이트",
            "general": "종합 학술 DB 사이트",
            "science": "자연/공학/의학 특화 사이트",
            "humanities": "인문/사회과학 특화 사이트",
            "art": "예체능/기타 특화 사이트"
        };

        let currentCategory = 'all';

        function init() {
            renderGrid();
            setupFilters();
        }

        function getTagClass(tag) {
            if (tag.includes("KCI")) return "tag-kci";
            if (tag.includes("SCI")) return "tag-sci";
            if (tag.includes("국내") || tag.includes("학위논문")) return "tag-dom";
            if (tag.includes("국제") || tag.includes("글로벌")) return "tag-int";
            return "";
        }

        function renderGrid() {
            const grid = document.getElementById('journal-grid');
            grid.innerHTML = '';

            const filteredData = currentCategory === 'all'
                ? journalData
                : journalData.filter(item => item.category === currentCategory);

            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                const tagsHtml = item.tags ? item.tags.map(t => `<span class="tag ${getTagClass(t)}">${t}</span>`).join('') : '';

                card.innerHTML = `
                    ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
                    <div class="card-title">${item.title}</div>
                    <div class="card-desc">${item.desc}</div>

                    <div class="card-footer">
                        <button class="btn-view" onclick="window.open('${item.url}', '_blank')">사이트 방문</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setupFilters() {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    buttons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    currentCategory = btn.dataset.category;
                    document.getElementById('current-category').innerText = categoryNames[currentCategory];
                    renderGrid();
                });
            });
        }

        /* --- 모달 및 토스트 --- */
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2500);
        }



        function copyApaPrompt() {
            const prompt = `아래 논문(또는 첨부 자료)을 읽고 다음 두 가지를 한국어로 작성해 주세요.

[1] 논문 요약
- 연구 목적 / 연구 방법 / 주요 결과 / 결론 및 시사점을 각각 2~4문장으로 요약해 주세요.
- 핵심 키워드를 5개 추출해 주세요.

[2] APA 7판 형식 참고문헌
- 아래 형식에 맞춰 참고문헌을 작성해 주세요.
  저자성(성, 이름 이니셜). (출판 연도). 논문 제목. 학술지명, 권(호), 시작 페이지-끝 페이지. https://doi.org/xxxxx
- DOI가 없으면 URL을 대신 기입하고, URL도 없으면 생략해 주세요.
- 저자가 3명 이하이면 전원 표기, 4명 이상이면 첫 저자 외 "... et al." 처리해 주세요.`;

            navigator.clipboard.writeText(prompt).then(() => {
                const btn = document.getElementById('btn-copy-prompt');
                const orig = btn.innerHTML;
                btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> 복사 완료!`;
                btn.style.background = 'rgba(16,185,129,0.5)';
                btn.style.borderColor = '#10b981';
                setTimeout(() => {
                    btn.innerHTML = orig;
                    btn.style.background = 'rgba(168,85,247,0.5)';
                    btn.style.borderColor = '#a855f7';
                }, 2000);
                showToast('프롬프트가 클립보드에 복사되었습니다! NotebookLM에 붙여넣기 하세요.');
            }).catch(() => {
                showToast('복사 실패: 브라우저가 클립보드 접근을 허용하지 않습니다.');
            });
        }

        init();
    </script>
    <!-- 토스트 알림 -->
    <div id="toast" style="
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
        background: rgba(30,10,10,0.95); color: white;
        padding: 12px 22px; border-radius: 10px; font-size: 14px;
        border: 1px solid rgba(255,255,255,0.12);
        box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        opacity: 0; pointer-events: none;
        transition: opacity 0.3s, transform 0.3s;
        z-index: 9999; max-width: 90vw; text-align: center;
    "></div>
    <style>
        #toast.show {
            opacity: 1 !important;
            transform: translateX(-50%) translateY(0) !important;
        }
    </style>
</body>
